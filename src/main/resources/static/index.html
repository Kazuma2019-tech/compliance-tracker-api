<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thumbnails</title>
    <meta name="viewport" content="width=device=width, initial-scale=1">
    <style>
        img {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 5px;
            width: 150px;

        }
        img:hover {
            box-shadow: 0 0 2px 1px rgba(0, 140, 186, 0.5);

        }
    </style>

</head>

<body>
<h2>Compliance-Tracker</h2>
<h3>Here is just a bit of a test for the working App</h3>
<div>
    <p>Click on the image to enlarge it.</p>
    <a target="_blank" href="JugOfThoughts.jpg">  <!-- JugOfThoughts.jpg -->
        <img src="JugOfThoughts.jpg" alt="jugOfThought" style="width: 100px" height="120px"></a>

    <a target="_blank" href="funny.jpeg">  <!--funny.jpeg-->
        <img src="funny.jpeg" alt="funny" style="width: 100px" height="120px"></a>
</div>

</body>
</html>
